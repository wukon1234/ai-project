server:
  port: 8080

spring:
  application:
    name: rag-demo
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

ai:
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    base-url: ${OPENAI_BASE-URL:https://api.openai.com}
    model-chat: gpt-4o
    model-embedding: text-embedding-3-small

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: knowledge_demo

file:
  upload-dir: ./uploads

logging:
  level:
    dev.langchain4j: DEBUG
    com.example.rag: DEBUG
