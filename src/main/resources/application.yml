server:
  port: 8080

spring:
  application:
    name: kb-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${KB_DB_URL:jdbc:mysql://127.0.0.1:3306/zhishiyun?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${KB_DB_USERNAME:root}
    password: ${KB_DB_PASSWORD:20030420}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  redis:
    host: ${KB_REDIS_HOST:127.0.0.1}
    port: ${KB_REDIS_PORT:6379}
    password: ${KB_REDIS_PASSWORD:}
    database: ${KB_REDIS_DATABASE:0}
    timeout: 200ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 联调排障：控制台打印完整 SQL + 参数（稳定后可改回默认/关掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

kb:
  storage:
    local-dir: ${KB_STORAGE_LOCAL_DIR:data/storage}
  jwt:
    issuer: zhishiyun-kb
    secret: ${KB_JWT_SECRET:changethissecretchangethissecret}
    access-token-minutes: ${KB_JWT_ACCESS_MINUTES:120}
    refresh-token-days: ${KB_JWT_REFRESH_DAYS:7}
    refresh-token-remember-days: ${KB_JWT_REFRESH_REMEMBER_DAYS:30}
  security:
    permit-all: false
  internal:
    api-key: ${KB_INTERNAL_API_KEY:internal-dev-key}
  milvus:
    host: ${KB_MILVUS_HOST:127.0.0.1}
    port: ${KB_MILVUS_PORT:19530}
    collection: ${KB_MILVUS_COLLECTION:kb_chunks}
    dimension: ${KB_MILVUS_DIMENSION:1536}
  embedding:
    model: ${KB_EMBEDDING_MODEL:text-embedding-3-small}
    endpoint: ${KB_EMBEDDING_ENDPOINT:https://api.openai.com/v1}
    api-key: ${KB_EMBEDDING_API_KEY:}
  llm:
    model: ${KB_LLM_MODEL:gpt-4o-mini}
    endpoint: ${KB_LLM_ENDPOINT:https://api.openai.com/v1}
    api-key: ${KB_LLM_API_KEY:}
  ocr:
    enabled: ${KB_OCR_ENABLED:true}
    lang: ${KB_OCR_LANG:chi_sim+eng}
    tessdata-path: ${KB_OCR_TESSDATA_PATH:}
    # PaddleOCR 服务地址；为空时回落本地 Tesseract
    base-url: ${KB_OCR_BASE_URL:}
    endpoint: ${KB_OCR_ENDPOINT:}
    api-key: ${KB_OCR_API_KEY:}
    retry: ${KB_OCR_RETRY:3}
    # fail=OCR 失败整任务 FAILED；skip=跳过该页继续
    page-fail-strategy: ${KB_OCR_PAGE_FAIL_STRATEGY:fail}
  minio:
    endpoint: ${KB_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${KB_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${KB_MINIO_SECRET_KEY:minioadmin}
    bucket: ${KB_MINIO_BUCKET:kb-files}
  rag:
    score-threshold: ${KB_RAG_SCORE_THRESHOLD:0.15}
    context-n: ${KB_RAG_CONTEXT_N:6}
    hybrid-enabled: ${KB_RAG_HYBRID_ENABLED:false}
  vision:
    enabled: ${KB_VISION_ENABLED:false}
    model: ${KB_VISION_MODEL:gpt-4o}
    endpoint: ${KB_VISION_ENDPOINT:https://api.openai.com/v1}
    api-key: ${KB_VISION_API_KEY:}
    max-pages-per-doc: ${KB_VISION_MAX_PAGES:3}
  stats:
    minutes-saved-per-ask: ${KB_STATS_MINUTES_PER_ASK:4}
  share:
    base-url: ${KB_SHARE_BASE_URL:http://localhost:5173}
    doc-expire-hours: ${KB_SHARE_DOC_EXPIRE_HOURS:72}
    blocked-libraries: ${KB_SHARE_BLOCKED_LIBRARIES:}
    require-login: ${KB_SHARE_REQUIRE_LOGIN:false}
  rate-limit:
    # 无 Redis 时可先关；有 Redis 再开
    enabled: ${KB_RATE_LIMIT_ENABLED:false}
    ask-per-minute: ${KB_RATE_LIMIT_ASK_PER_MINUTE:10}
  sso:
    enabled: ${KB_SSO_ENABLED:false}
    mock-enabled: ${KB_SSO_MOCK_ENABLED:true}
    client-id: ${KB_SSO_CLIENT_ID:}
    client-secret: ${KB_SSO_CLIENT_SECRET:}
    tenant: ${KB_SSO_TENANT:common}
    redirect-uri: ${KB_SSO_REDIRECT_URI:http://localhost:8080/api/v1/auth/sso/callback}
    frontend-redirect: ${KB_SSO_FRONTEND_REDIRECT:http://localhost:5173/}

auth:
  register:
    auto-approve: ${KB_REGISTER_AUTO_APPROVE:true}
    company-email-suffixes: ${KB_REGISTER_EMAIL_SUFFIXES:@company.com}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    root: info
    # Mapper SQL（配合 mybatis-plus log-impl；也可单独用 debug 看参数绑定）
    com.zhishiyun.kb.mapper: debug
    com.zhishiyun.kb.service.AuthService: debug
    com.zhishiyun.kb.controller.AuthController: debug
    com.zhishiyun.kb.filter.JwtAuthFilter: debug
    com.zhishiyun.kb.admin: debug


